<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI参謀 試作版</title><style>body{font-family:system-ui,sans-serif;background:#f3f5f8;color:#172235;margin:0}.wrap{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.muted{color:#64748b}.panel{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}button{border:0;border-radius:10px;padding:12px 16px;background:#173b71;color:white;font-weight:700;margin:4px;cursor:pointer}button:disabled{opacity:.4}textarea{box-sizing:border-box;width:100%;min-height:100px;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:16px}#log{white-space:pre-wrap;max-height:280px;overflow:auto;line-height:1.65}.tag{display:inline-block;background:#e5edf9;border-radius:20px;padding:5px 10px}.warning{background:#fff6df;padding:12px;border-radius:10px}</style></head><body><main class="wrap"><h1>🧠 AI参謀</h1><p class="muted">議論に参加する第三者AI・画面試作版</p><section class="panel"><span class="tag" id="status">待機中</span><h2>議論を記録</h2><p class="muted">対応ブラウザでは音声認識を試せます。音声認識はブラウザ側のサービスを使う場合があります。</p><button id="start">🎙 音声認識開始</button><button id="stop" disabled>停止</button><p id="interim" class="muted"></p><textarea id="manual" placeholder="音声認識が使えない場合は、議論の内容をここに入力"></textarea><button id="add">文章を記録に追加</button></section><section class="panel"><h2>議論の記録</h2><div id="log">まだ記録はありません。</div></section><section class="panel"><h2>第三者の意見</h2><p class="muted">この試作版はAI未接続です。議論内容をコピーしてChatGPTに渡し、回答を得られます。</p><button id="copy">📋 AIへの質問をコピー</button><button id="speak">🔊 読み上げテスト</button><p id="msg" class="muted"></p></section><section class="panel warning"><strong>取り扱い上の注意</strong><p>実際の業務会話、個人情報、非公開情報は入力しないでください。参加者の録音同意と組織のセキュリティ確認が必要です。この版はAI自動応答・話者識別・録音ファイル保存に未対応です。</p></section></main><script>const $=id=>document.getElementById(id);let lines=[],rec=null,active=false;function render(){ $('log').textContent=lines.length?lines.join('\n\n'):'まだ記録はありません。'}function append(s){if(s.trim()){lines.push(s.trim());render()}}$('add').onclick=()=>{append($('manual').value);$('manual').value=''};const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){$('start').disabled=true;$('msg').textContent='このブラウザでは音声認識を利用できません。文章入力を使ってください。'}else{rec=new SpeechRecognition();rec.lang='ja-JP';rec.continuous=true;rec.interimResults=true;rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)append(t);else interim+=t}$('interim').textContent=interim};rec.onerror=e=>{$('msg').textContent='音声認識エラー: '+e.error};rec.onend=()=>{active=false;$('status').textContent='停止中';$('start').disabled=false;$('stop').disabled=true};$('start').onclick=()=>{try{rec.start();active=true;$('status').textContent='音声認識中';$('start').disabled=true;$('stop').disabled=false}catch(e){$('msg').textContent=e.message}};$('stop').onclick=()=>rec.stop()}$('copy').onclick=async()=>{let prompt='あなたは公平で独立した第三者のAI参謀です。次の議論を読み、①争点②双方の主張の妥当性③見落とし④第三の選択肢⑤推奨案を簡潔に述べてください。事実と推測を区別してください。\n\n'+lines.join('\n');if(!lines.length){$('msg').textContent='先に議論を記録してください。';return}try{await navigator.clipboard.writeText(prompt);$('msg').textContent='コピーしました。ChatGPTに貼り付けてください。'}catch(e){$('msg').textContent='コピーできませんでした。HTTPSで開いてください。'}};$('speak').onclick=()=>{if(!('speechSynthesis'in window))return $('msg').textContent='読み上げ非対応です';speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('AI参謀です。第三者として、議論の争点と見落としを整理します。');u.lang='ja-JP';speechSynthesis.speak(u)};</script></body></html>
